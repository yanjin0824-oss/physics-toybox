---
app:
  id: "7698674595133538367"
  name: 物理玩具箱
  slogan: 在真实空间发射炮弹，体验彩色积木倒塌与重建的乐趣
  description: |-
    物理玩具箱是一款面向 PICO 空间体验的互动应用。在保持真实环境可见的 Mixed Stage 中，彩色积木搭成一座由 50 块积木组成的六层金字塔，前方设有发射与重建操作区。你可以点击积木或场地发射炮弹，也可以使用“发射”按钮瞄准积木塔中心，观察积木受到撞击后倾倒、滑动和散落的过程。

    积木与炮弹使用原生物理模拟，包含重力、碰撞和摩擦。炮弹根据当前头部位置确定发射起点，使点击目标与空间中的射击方向对应。界面实时显示发射次数和倒下的积木数量，便于观察每次操作带来的变化。点击“重建”即可清除炮弹并恢复完整的 50 块积木塔，继续尝试不同目标和连续发射。

    应用提供中文名称、操作提示和无障碍按钮说明，适合用于空间交互演示、物理现象观察和轻松的积木破坏体验。
